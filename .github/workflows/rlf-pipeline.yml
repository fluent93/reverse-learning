name: RLF Multi-Agent Pipeline

on:
  push:
    branches:
      - "feature/**"
      - "pipeline/**"
      - "feat/**"
    paths:
      - "briefs/**"
      - "drafts/**"
      - "final/**"
      - "verification/**"
      - "state.json"
      - "agents/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      force_agent:
        description: "Run this agent (orchestrate if empty)"
        required: false
        type: choice
        options:
          - ""
          - drafter
          - critic
          - reviser
          - finalist
          - verifier
          - publisher

permissions:
  contents: write

concurrency:
  group: rlf-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  orchestrate-and-run:
    runs-on: ubuntu-latest
    if: |
      github.repository == 'fluent93/reverse-learning' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.head_commit == null ||
       !contains(github.event.head_commit.message, '[skip ci]'))
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Decide next agent
        id: route
        run: |
          if [ -n "${{ inputs.force_agent }}" ]; then
            echo "next_agent=${{ inputs.force_agent }}" >> "$GITHUB_OUTPUT"
            echo "reason=workflow_dispatch force_agent" >> "$GITHUB_OUTPUT"
          else
            DECISION=$(python scripts/orchestrate.py --json --no-write)
            echo "$DECISION"
            echo "next_agent=$(echo "$DECISION" | python -c "import sys,json; print(json.load(sys.stdin)['next_agent'])")" >> "$GITHUB_OUTPUT"
            echo "reason=$(echo "$DECISION" | python -c "import sys,json; print(json.load(sys.stdin)['reason'])")" >> "$GITHUB_OUTPUT"
          fi
          python scripts/orchestrate.py --json

      - name: Skip — human gate or done
        if: steps.route.outputs.next_agent == 'human' || steps.route.outputs.next_agent == 'done'
        run: |
          echo "Pipeline paused: ${{ steps.route.outputs.next_agent }}"
          echo "Reason: ${{ steps.route.outputs.reason }}"

      - name: Check API secrets
        id: secrets
        if: steps.route.outputs.next_agent != 'human' && steps.route.outputs.next_agent != 'done'
        run: |
          AGENT="${{ steps.route.outputs.next_agent }}"
          MISSING=""
          if [ "$AGENT" = "drafter" ] || [ "$AGENT" = "reviser" ] || [ "$AGENT" = "verifier" ]; then
            [ -z "${{ secrets.OPENAI_API_KEY }}" ] && MISSING="OPENAI_API_KEY"
          fi
          if [ "$AGENT" = "critic" ] || [ "$AGENT" = "finalist" ] || [ "$AGENT" = "publisher" ]; then
            [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ] && MISSING="${MISSING} ANTHROPIC_API_KEY"
          fi
          if [ -n "$MISSING" ]; then
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing secrets:$MISSING — add in repo Settings → Secrets. See agents/AUTOMATION.md"
          else
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run agent (LLM)
        if: steps.route.outputs.next_agent != 'human' && steps.route.outputs.next_agent != 'done' && steps.secrets.outputs.has_secrets == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o' }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-4-20250514' }}
        run: python scripts/run_agent.py --agent "${{ steps.route.outputs.next_agent }}"

      - name: Manual fallback comment
        if: steps.route.outputs.next_agent != 'human' && steps.route.outputs.next_agent != 'done' && steps.secrets.outputs.has_secrets != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const agent = '${{ steps.route.outputs.next_agent }}';
            const reason = `${{ steps.route.outputs.reason }}`.replace(/'/g, "'");
            const body = `## RLF Pipeline — manual step required\n\n**Next agent:** \`${agent}\`\n\n**Reason:** ${reason}\n\nAPI secrets are not configured. Add \`OPENAI_API_KEY\` and/or \`ANTHROPIC_API_KEY\` in repository secrets, or run manually per \`agents/RUNBOOK.md\`.\n\nPrompt file: \`agents/*_${agent}.md\` (see agents folder numbering).`;
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body
            }).catch(() => core.info('Could not post commit comment'));

      - name: Commit and push agent outputs
        if: steps.route.outputs.next_agent != 'human' && steps.route.outputs.next_agent != 'done' && steps.secrets.outputs.has_secrets == 'true'
        run: |
          git config user.name "rlf-pipeline-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drafts reviews final verification posts state.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No file changes to commit"
            exit 0
          fi
          git commit -m "chore(pipeline): ${{ steps.route.outputs.next_agent }} agent run [skip ci]"
          git push
